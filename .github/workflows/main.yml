version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: drivedigitalai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: drivedigitalai
      MYSQL_USER: drivedigitalai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-drivedigitalai_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - drivedigitalai-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: drivedigitalai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - drivedigitalai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
      interval: 5s
    restart: unless-stopped

  # Node.js Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drivedigitalai-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: mysql://drivedigitalai:${MYSQL_PASSWORD:-drivedigitalai_password}@mysql:3306/drivedigitalai
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      REDIS_URL: redis://redis:6379
      PORT: 3000
      PAYMENT_HOLD_MODE: ${PAYMENT_HOLD_MODE:-true}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - drivedigitalai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      timeout: 10s
      retries: 5
      interval: 10s
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: drivedigitalai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - drivedigitalai-network
    restart: unless-stopped

  # Adminer (Database UI - Optional)
  adminer:
    image: adminer:latest
    container_name: drivedigitalai-adminer
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - drivedigitalai-network
    restart: unless-stopped
    profiles:
      - dev

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  drivedigitalai-network:
    driver: bridge
    
